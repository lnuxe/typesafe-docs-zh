    reason: "模型类别名，docs.json 与全部已译页面均保留英文。注意：卡尼曼心理学意义上的 System 1 / System 2 译作「系统 1 / 系统 2」，不在此列。"
    examples:
      - file: "_tsdoc/concepts/state.md"
        line: 3
        text: "> 什么是状态、如何组织它，以及如何为 System One 模型提供所需的上下文。"
  - term: "jaggedness"
    zh: "锯齿效应"
    status: "新增译法"
    forbidden: ["参差不齐度"]
    reason: "指模型能力分布不均；正文首次出现写「锯齿效应（jaggedness）」，与 models.md 里「已知缺陷」的链接文案不冲突。"
    examples:
      - file: "_tsdoc/models.md"
